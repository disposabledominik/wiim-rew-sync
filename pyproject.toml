[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiim-rew-sync"
version = "0.1.0"
description = "WiiM ↔ REW PEQ Sync Tool — transfer parametric EQ configurations between REW and WiiM devices"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "zeroconf>=0.132.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-qt>=4.4.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
package = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
wiim-rew-sync = "src.cli.main:main"

# ---------------------------------------------------------------------------
# Setuptools — package discovery
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"
qt_api = "pyside6"
addopts = [
    "--cov=src/translator",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
filterwarnings = [
    # GUI tests mock the async bridge — coroutines created by _bridge_wrapper,
    # _do_push, _do_probe, etc. are never awaited. This is expected and harmless.
    "ignore::RuntimeWarning:unittest.mock",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/translator"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ---------------------------------------------------------------------------
# ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",    # Use of `assert` (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"src/tests/**" = ["ANN", "S"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ---------------------------------------------------------------------------
# mypy — strict mode for translator/ and models/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["src.translator.*", "src.models.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "zeroconf.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["src.tests.*"]
disable_error_code = ["method-assign", "type-arg", "arg-type"]
