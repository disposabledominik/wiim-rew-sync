name: CI

on:
  # No 'main' in the push trigger: main only ever receives fast-forward
  # merges from development (see CLAUDE.md), so any commit reaching main
  # already passed this same suite on development moments earlier --
  # re-running it here would just re-test an identical, already-green tree.
  # release.yml's tag-triggered pip-audit + build is the real gate for
  # main-bound code. pull_request still covers main in case a PR is ever
  # opened against it by mistake.
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # PR titles feed both the GitHub Release notes (`gh release create
      # --generate-notes` in release.yml) and scripts/tag_release.sh's tag
      # message -- see docs/release_process.md. This is a floor, not a style
      # check: catch an empty/placeholder title before it becomes permanent
      # release history, nothing more.
      #
      # $PR_TITLE is passed via `env`, not interpolated into the script
      # body, so an attacker-controlled title can't inject shell commands.
      - name: Check PR title is descriptive
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title=$(echo "$PR_TITLE" | xargs)
          lower=$(echo "$title" | tr '[:upper:]' '[:lower:]')

          if [[ -z "$title" ]]; then
            echo "::error::PR title is empty. Write a descriptive title (see docs/release_process.md)."
            exit 1
          fi
          if [[ ${#title} -lt 10 ]]; then
            echo "::error::PR title '$title' is too short (<10 chars). Write a descriptive title (see docs/release_process.md)."
            exit 1
          fi
          for placeholder in wip update updates fix fixes change changes misc stuff test testing; do
            if [[ "$lower" == "$placeholder" ]]; then
              echo "::error::PR title '$title' is a placeholder, not a description (see docs/release_process.md)."
              exit 1
            fi
          done
          echo "PR title OK: $title"

  doc-sync-nudge:
    name: Same-commit doc-sync nudge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Advisory only, not a hard gate: not every "Fix #N" commit is a logged
      # GUI bug in smoke_test_issues.md, so this can't be a reliable pass/fail
      # check -- it's a visible nudge toward CLAUDE.md's same-commit rule
      # (the #244 drift the doc-consistency check now catches after the fact
      # started exactly like this: a fix commit landed with no doc-row update
      # in the same PR).
      - name: Warn if a "Fix #N" commit doesn't touch smoke_test_issues.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          fix_commits=$(git log "$merge_base..$HEAD_SHA" --oneline --grep '^Fix #[0-9]' -i -E)
          changed_files=$(git diff --name-only "$merge_base" "$HEAD_SHA")

          if [[ -n "$fix_commits" ]] && ! grep -qx 'docs/smoke_test_issues.md' <<< "$changed_files"; then
            echo "::warning::This PR has commit(s) whose message starts with 'Fix #<N>' but does not touch docs/smoke_test_issues.md. If this fixes a logged GUI bug, update its Status + Fix Commit in this same PR (CLAUDE.md's same-commit rule)."
            echo "Commit(s):"
            echo "$fix_commits"
          else
            echo "OK: no same-commit doc-sync gap detected."
          fi

  lint-type-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/

      - name: Mypy (type check)
        run: mypy src/

      # If a vulnerability has no upstream fix yet, suppress it explicitly rather than
      # disabling this gate: pip-audit --ignore-vuln GHSA-xxxx-xxxx-xxxx (repeatable),
      # with a comment noting the advisory and why it's accepted.
      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit

      - name: Pytest (with coverage gate)
        run: pytest
