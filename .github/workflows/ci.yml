name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt runtime libraries (headless)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install project (dev extras)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src/

      - name: Mypy (type check)
        run: mypy src/

      # If a vulnerability has no upstream fix yet, suppress it explicitly rather than
      # disabling this gate: pip-audit --ignore-vuln GHSA-xxxx-xxxx-xxxx (repeatable),
      # with a comment noting the advisory and why it's accepted.
      - name: pip-audit (dependency vulnerability scan)
        run: pip-audit

      - name: Pytest (with coverage gate)
        run: pytest
