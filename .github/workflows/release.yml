name: Release

# Tag convention: vMAJOR.MINOR.PATCH (e.g. v1.2.3). Note the pre-existing
# v0.1 / v0.2 tags predate this pipeline and are two-part -- they will not
# (and should not) trigger a release build. All new tags should be three-part
# semver going forward.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  dependency-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (package extras) + pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[package]" pip-audit

      # If a vulnerability has no upstream fix yet, suppress it explicitly rather than
      # disabling this gate: pip-audit --ignore-vuln GHSA-xxxx-xxxx-xxxx (repeatable),
      # with a comment noting the advisory and why it's accepted.
      - name: pip-audit (fail release on known vulnerabilities)
        run: pip-audit

  build:
    name: Build (${{ matrix.os }})
    needs: dependency-audit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            spec: packaging/wiim_rew_sync_windows.spec
            asset: WiiM-REW-Sync-windows-x64.zip
          - os: macos-latest
            spec: packaging/wiim_rew_sync_macos.spec
            asset: WiiM-REW-Sync-macos.zip
          - os: ubuntu-latest
            spec: packaging/wiim_rew_sync_linux.spec
            asset: WiiM-REW-Sync-linux-x64.zip
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full tag history so setuptools_scm resolves the tagged version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project (package extras -> PyInstaller)
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[package]"

      - name: Show resolved version (sanity check)
        run: python -c "from src.utils.version import get_app_version; print(get_app_version())"

      - name: Build with PyInstaller
        run: pyinstaller ${{ matrix.spec }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/WiiM-REW-Sync.exe -DestinationPath ${{ matrix.asset }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/WiiM-REW-Sync.app ${{ matrix.asset }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/WiiM-REW-Sync
          (cd dist && zip -X ../${{ matrix.asset }} WiiM-REW-Sync)

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.zip > SHA256SUMS.txt

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            artifacts/WiiM-REW-Sync-windows-x64.zip \
            artifacts/WiiM-REW-Sync-macos.zip \
            artifacts/WiiM-REW-Sync-linux-x64.zip \
            artifacts/SHA256SUMS.txt
